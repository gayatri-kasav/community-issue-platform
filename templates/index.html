<!DOCTYPE html>
<html>
<head>
    <title>Community Issue Reporting Platform</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            text-align: center;
        }

        .box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            margin-top: 20px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <header>
        <h1>Community Issue Reporting Platform</h1>
        <p>Report problems in your community easily</p>
    </header>

    <div class="container">

        <div class="box">

            <h2>Welcome!</h2>

            <p>
                This platform allows citizens to report
                problems in their local area.
            </p>

            <a href="/report">
                <button>Report an Issue</button>
            </a>

            <a href="/track">
                <button>Track Complaint</button>
            </a>
            <a href="/complaints">
                <button>View Complaints</button>
            </a>
            <a href="/admin_login">
                <button>Admin Login</button>
            </a>

        </div>

    </div>

</body>
</html>
