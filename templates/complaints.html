<!DOCTYPE html>
<html>
<head>
    <title>Submitted Complaints</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h1>Submitted Complaints</h1>
    <div style="text-align: center; margin-bottom: 20px;">
    <a href="/">
        <button style="
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        ">
            Home
        </button>
    </a>
</div>
    <table>
        <tr>
            <th>Complaint ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Location</th>
            <th>Description</th>
            <th>Status</th>
            <th>Date</th>
        </tr>

        {% for complaint in complaints %}
        <tr>
            <td>{{ complaint[0] }}</td>
            <td>{{ complaint[1] }}</td>
            <td>{{ complaint[2] }}</td>
            <td>{{ complaint[3] }}</td>
            <td>{{ complaint[4] }}</td>
            <td>{{ complaint[5] }}</td>
            <td>{{ complaint[6] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
