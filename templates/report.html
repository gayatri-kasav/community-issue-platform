
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Issue | Community Connect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #eaf2ff,
                    #f4f7fc,
                    #dbeafe
                );
            padding: 20px 0;
        }

        .report-header {
            text-align: center;
            padding: 25px 15px 5px;
        }

        .report-header h1 {
            color: #1e3a8a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .report-header p {
            color: #64748b;
        }

        .report-form {
            background: white;
            width: 90%;
            max-width: 600px;
            margin: 25px auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.10);
        }

        .form-icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .report-form label {
            display: block;
            margin: 17px 0 7px;
            color: #334155;
            font-weight: 600;
        }

        .report-form input,
        .report-form select,
        .report-form textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: #f8fafc;
            transition: 0.2s;
        }

        .report-form input:focus,
        .report-form select:focus,
        .report-form textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .report-form textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .form-buttons .btn {
            flex: 1;
            text-align: center;
        }

        .home-link {
            background: #eaf2ff;
            color: #1d4ed8;
        }

        .home-link:hover {
            background: #dbeafe;
        }

        .required-note {
            color: #64748b;
            font-size: 13px;
            margin-top: 15px;
        }

        @media (max-width: 500px) {
            .report-form {
                padding: 23px;
            }

            .form-buttons {
                flex-direction: column;
            }

            .report-header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="report-header">

        <h1>Report a Community Issue</h1>

        <p>
            Help us improve your neighbourhood by reporting
            local problems.
        </p>

    </div>


    <div class="report-form">

        <div class="form-icon">📝</div>

        <h2 style="text-align:center; color:#1e3a8a;">
            Issue Details
        </h2>

        <form method="POST" action="/submit">

            <label for="name">Full Name *</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
                minlength="2"
            >


            <label for="category">Issue Category *</label>

            <select id="category" name="category" required>

                <option value="" disabled selected>
                    Select an issue category
                </option>

                <option value="Road">Road</option>
                <option value="Water">Water</option>
                <option value="Electricity">Electricity</option>
                <option value="Garbage">Garbage</option>
                <option value="Street Light">Street Light</option>
                <option value="Other">Other</option>

            </select>


            <label for="location">Location *</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter area or locality"
                required
            >


            <label for="description">Describe the Issue *</label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Explain the problem in detail..."
                required
            ></textarea>


            <div class="form-buttons">

                <button type="submit" class="btn">
                    Submit Issue
                </button>

                <a href="/" class="btn home-link">
                    Home
                </a>

            </div>

            <p class="required-note">
                * All fields are required.
            </p>

        </form>

    </div>


    <footer class="footer">
        <p>© 2026 Community Issue Reporting Platform</p>
        <p>Connecting Citizens | Improving Communities</p>
    </footer>

</body>
</html>
