<!DOCTYPE html>
<html>
<head>
    <title>Complaint Not Found</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 50px;
        }

        .box {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: #e74c3c;
        }

        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .home-button {
            background-color: #2c3e50;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Complaint Not Found</h1>

        <p>
            No complaint was found with the entered Complaint ID.
        </p>

        <a href="/track">
            <button>Try Again</button>
        </a>

        <a href="/">
            <button class="home-button">Home</button>
        </a>

    </div>

</body>
</html>
