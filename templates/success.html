<!DOCTYPE html>
<html>
<head>
    <title>Complaint Submitted</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 50px;
        }

        .box {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: #27ae60;
        }

        .complaint-id {
            font-size: 22px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .home-button {
            background-color: #2c3e50;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Issue Submitted Successfully!</h1>

        <p>Your complaint has been recorded successfully.</p>

        <div class="complaint-id">
            Complaint ID: {{ complaint_id }}
        </div>

        <p>
            Please save your Complaint ID to track your complaint later.
        </p>

        <a href="/track">
            <button>Track Complaint</button>
        </a>

        <a href="/">
            <button class="home-button">Home</button>
        </a>

    </div>

</body>
</html>
